<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التوجيه...</title>
  <style>
    /* إعادة ضبط الخصائص */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0f172a;
      background-image: radial-gradient(at 50% 0%, #1e293b 0px, transparent 75%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* كارت التوجيه */
    .redirect-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    /* البراند واللوجو */
    .brand-section {
      margin-bottom: 16px;
    }

    .logo {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
    }

    .brand-tag {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .brand-name {
      color: #38bdf8;
      font-weight: 700;
    }

    /* معلومات الجهة المستهدفة */
    .destination-box {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .destination-label {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 2px;
    }

    .destination-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #38bdf8;
      word-break: break-all;
    }

    /* العداد وشريط التقدم */
    .timer-section {
      margin-bottom: 16px;
    }

    .timer-text {
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .seconds-counter {
      font-weight: bold;
      color: #38bdf8;
    }

    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      border-radius: 10px;
      transition: width 1s linear;
    }

    /* قسم التعريف بالستاند (ملموم وشيك) */
    .promo-box {
      background: rgba(37, 99, 235, 0.1);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      text-align: right;
    }

    .promo-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .promo-desc {
      font-size: 0.75rem;
      color: #cbd5e1;
      line-height: 1.4;
    }

    /* الأزرار */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      text-decoration: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: block;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      border: none;
      width: 100%;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: transparent;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 0.8rem;
    }

    .btn-secondary:hover {
      background: rgba(56, 189, 248, 0.08);
    }
  </style>
</head>
<body>

  <div class="redirect-card">
    <!-- بصمتك واللوجو -->
    <div class="brand-section">
      <div class="logo">MY</div>
      <p class="brand-tag">هذا الستاند / الرابط من إعداد <span class="brand-name">محمد ياسر</span></p>
    </div>

    <!-- جهة التوجيه -->
    <div class="destination-box">
      <p class="destination-label">جاري توجيهك إلى:</p>
      <p id="dest-name" class="destination-name">جاري التحديد... 🔗</p>
    </div>

    <!-- العداد وشريط الوقت -->
    <div class="timer-section">
      <p class="timer-text">الانتقال التلقائي خلال <span id="countdown" class="seconds-counter">5</span> ثوانٍ...</p>
      <div class="progress-bar-bg">
        <div id="progress" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- قسم التعريفي بالستاند NFC -->
    <div class="promo-box">
      <p class="promo-title">✨ ما هو هذا الستاند؟</p>
      <p class="promo-desc">ستاند ذكي بتقنية NFC لتسهيل مشاركة صفحات التواصل الاجتماعي، وتقييمات جوجل، ووسائل الدفع بلمسة واحدة لمشروعك أو محلك!</p>
    </div>

    <!-- الأزرار -->
    <div class="actions">
      <button id="redirect-btn" class="btn btn-primary">الانتقال فوراً الآن 🚀</button>
      <a href="https://s-h.s.gy" target="_blank" class="btn btn-secondary">طلب ستاند NFC ذكي خاص بك 📲</a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const defaultUrl = "https://payment-mohamed.vercel.app/"; 
    const targetUrl = urlParams.get('to') || defaultUrl;
    
    let destName = urlParams.get('title');
    
    if (!destName) {
      try {
        const urlObj = new URL(targetUrl);
        let hostname = urlObj.hostname.replace('www.', '');
        
        if (hostname.includes('facebook.com')) {
          destName = "صفحة الفيسبوك الشخصية ُ📘";
        } else if (hostname.includes('instagram.com')) {
          `حساب الإنستجرام 📸`;
        } else if (hostname.includes('wa.me') || hostname.includes('whatsapp.com')) {
          destName = "محادثة الواتساب 💬";
        } else if (hostname.includes('vercel.app')) {
          destName = "بوابة الدفع / المنصة الخاصة 💳";
        } else {
          destName = hostname;
        }
      } catch (e) {
        destName = "الرابط المستهدف 🔗";
      }
    }

    document.getElementById('dest-name').textContent = destName;

    function doRedirect() {
      window.location.replace(targetUrl);
    }

    document.getElementById('redirect-btn').addEventListener('click', doRedirect);

    let timeLeft = 5;
    const countdownEl = document.getElementById('countdown');
    const progressEl = document.getElementById('progress');

    const timer = setInterval(() => {
      timeLeft--;
      countdownEl.textContent = timeLeft;
      
      let percentage = (timeLeft / 5) * 100;
      progressEl.style.width = percentage + '%';

      if (timeLeft <= 0) {
        clearInterval(timer);
        doRedirect();
      }
    }, 1000);
  </script>

</body>
</html>
