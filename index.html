<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Redirecting...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #090d16;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.15) 0%, transparent 40%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }

    .redirect-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px 22px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 
                  0 0 30px rgba(37, 99, 235, 0.1);
    }

    .brand-section {
      margin-bottom: 18px;
    }

    .logo {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
    }

    .brand-tag {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .brand-name {
      color: #38bdf8;
      font-weight: 700;
    }

    .destination-box {
      background: rgba(15, 23, 42, 0.7);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid rgba(56, 189, 248, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .destination-label {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .destination-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: #38bdf8;
      word-break: break-all;
    }

    .timer-section {
      margin-bottom: 18px;
    }

    .timer-text {
      font-size: 0.82rem;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    .seconds-counter {
      font-weight: 800;
      color: #f43f5e;
      font-size: 1.1rem;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #3b82f6, #f43f5e);
      border-radius: 10px;
      transition: width 1s linear;
    }

    .promo-box {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.08), rgba(124, 58, 237, 0.08));
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 18px;
      text-align: left;
    }

    .promo-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
    }

    .promo-desc {
      font-size: 0.75rem;
      color: #cbd5e1;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      text-decoration: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.25s ease;
      display: block;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      border: none;
      width: 100%;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.03);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <div class="redirect-card">
    <div class="brand-section">
      <div class="logo">MY</div>
      <p class="brand-tag">Created by <span class="brand-name">Mohamed Yasser</span></p>
    </div>

    <div class="destination-box">
      <p class="destination-label">You are being redirected to:</p>
      <p id="dest-name" class="destination-name">Loading...</p>
    </div>

    <div class="timer-section">
