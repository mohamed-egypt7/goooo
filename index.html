<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Redirecting...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #090d16;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.15) 0%, transparent 40%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }

    .redirect-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px 22px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 
                  0 0 30px rgba(37, 99, 235, 0.1);
    }

    .brand-section {
      margin-bottom: 18px;
    }

    .logo {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
    }

    .brand-tag {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .brand-name {
      color: #38bdf8;
      font-weight: 700;
    }

    .destination-box {
      background: rgba(15, 23, 42, 0.7);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid rgba(56, 189, 248, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .destination-label {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .destination-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: #38bdf8;
      word-break: break-all;
    }

    .timer-section {
      margin-bottom: 18px;
    }

    .timer-text {
      font-size: 0.82rem;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    .seconds-counter {
      font-weight: 800;
      color: #f43f5e;
      font-size: 1.1rem;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #3b82f6, #f43f5e);
      border-radius: 10px;
      transition: width 1s linear;
    }

    .promo-box {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.08), rgba(124, 58, 237, 0.08));
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 18px;
      text-align: left;
    }

    .promo-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
    }

    .promo-desc {
      font-size: 0.75rem;
      color: #cbd5e1;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      text-decoration: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.25s ease;
      display: block;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      border: none;
      width: 100%;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.03);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <div class="redirect-card">
    <div class="brand-section">
      <div class="logo">MY</div>
      <p class="brand-tag">Created by <span class="brand-name">Mohamed Yasser</span></p>
    </div>

    <div class="destination-box">
      <p class="destination-label">You are being redirected to:</p>
      <p id="dest-name" class="destination-name">Loading...</p>
    </div>

    <div class="timer-section">
      <p class="timer-text">Automatic redirect in <span id="countdown" class="seconds-counter">5</span> seconds...</p>
      <div class="progress-bar-bg">
        <div id="progress" class="progress-bar-fill"></div>
      </div>
    </div>

    <div class="promo-box">
      <p class="promo-title">✨ Smart NFC Stand</p>
      <p class="promo-desc">Instantly share your social media, Google reviews, and payment options with a single tap!</p>
    </div>

    <div class="actions">
      <button id="redirect-btn" class="btn btn-primary">Go Now 🚀</button>
      <a href="https://s-h.s.gy" target="_blank" class="btn btn-secondary">Get Your Custom NFC Stand 📲</a>
    </div>
  </div>

  <script>
    const defaultUrl = "https://payment-mohamed.vercel.app/";
    const fullHref = window.location.href;
    
    let targetUrl = defaultUrl;
    
    if (fullHref.includes('?to=')) {
      const parts = fullHref.split('?to=');
      if (parts.length > 1) {
        targetUrl = decodeURIComponent(parts[1]);
      }
    } else if (fullHref.includes('&to=')) {
      const parts = fullHref.split('&to=');
      if (parts.length > 1) {
        targetUrl = decodeURIComponent(parts[1]);
      }
    }

    targetUrl = targetUrl.trim();
    if (!targetUrl.startsWith('http')) {
      targetUrl = defaultUrl;
    }

    // القاموس المخصص لروابطك ومشاريعك الخاصة
    const customNames = {
      "payment": "Payment Page",
      "mo-carrd": "Mo Carrd"
    };

    try {
      const urlObj = new URL(targetUrl);
      let hostname = urlObj.hostname.toLowerCase();
      let displayName = "";

      // لو الرابط تابع لدومينك الخاص أو رابط اختصارك (أو يمكنك إضافة دومينك الشيك الجديد هنا لاحقاً)
      if (hostname.includes('s-h.s.gy') || hostname.includes('vercel.app')) {
        let pathSegments = urlObj.pathname.split('/').filter(Boolean);
        let subDomain = hostname.split('.')[0];
        
        let targetKey = pathSegments.length > 0 ? pathSegments[pathSegments.length - 1].toLowerCase() : subDomain;

        if (customNames[targetKey]) {
          displayName = customNames[targetKey];
        } else {
          let cleaned = targetKey.replace(/[-_]/g, ' ');
          displayName = cleaned.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        }
      } else {
        // لأي دومين خارجي آخر، استخراج اسم الموقع وتكبير أول حرف منه تلقائياً
        let domainParts = hostname.replace('www.', '').split('.');
        let siteName = domainParts.length >= 2 ? domainParts[domainParts.length - 2] : domainParts[0];
        displayName = siteName.charAt(0).toUpperCase() + siteName.slice(1);
      }

      document.getElementById('dest-name').textContent = displayName;
      document.title = "Redirecting to " + displayName;
    } catch (e) {
      document.getElementById('dest-name').textContent = targetUrl;
    }

    function doRedirect() {
      window.location.replace(targetUrl);
    }

    document.getElementById('redirect-btn').addEventListener('click', doRedirect);

    let timeLeft = 5;
    const countdownEl = document.getElementById('countdown');
    const progressEl = document.getElementById('progress');

    const timer = setInterval(() => {
      timeLeft--;
      countdownEl.textContent = timeLeft;
      
      let percentage = (timeLeft / 3) * 100;
      progressEl.style.width = percentage + '%';

      if (timeLeft <= 0) {
        clearInterval(timer);
        doRedirect();
      }
    }, 1000);
  </script>

</body>
</html>
