<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التوجيه...</title>
  <style>
    /* إعادة ضبط الخصائص */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0f172a;
      background-image: radial-gradient(at 50% 0%, #1e293b 0px, transparent 75%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* كارت التوجيه */
    .redirect-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 28px 20px;
      width: 100%;
      max-width: 360px; /* حجم ملموم جداً للموبايل */
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    /* البراند واللوجو */
    .brand-section {
      margin-bottom: 20px;
    }

    .logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
    }

    .brand-tag {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .brand-name {
      color: #38bdf8;
      font-weight: 700;
    }

    /* معلومات الجهة المستهدفة */
    .destination-box {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .destination-label {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .destination-name {
      font-size: 1rem;
      font-weight: 700;
      color: #38bdf8;
      word-break: break-all;
    }

    /* العداد وشريط التقدم */
    .timer-section {
      margin-bottom: 22px;
    }

    .timer-text {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .seconds-counter {
      font-weight: bold;
      color: #38bdf8;
      font-size: 1rem;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      border-radius: 10px;
      transition: width 1s linear;
    }

    /* الأزرار */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: block;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: transparent;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.8rem;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="redirect-card">
    <!-- بصمتك واللوجو -->
    <div class="brand-section">
      <div class="logo">MY</div>
      <p class="brand-tag">هذا الستاند / الرابط من إعداد <span class="brand-name">محمد ياسر</span></p>
    </div>

    <!-- جهة التوجيه -->
    <div class="destination-box">
      <p class="destination-label">جاري توجيهك إلى:</p>
      <p id="dest-name" class="destination-name">صفحة الفيسبوك الرسمية 🔗</p>
    </div>

    <!-- العداد وشريط الوقت -->
    <div class="timer-section">
      <p class="timer-text">الانتقال التلقائي خلال <span id="countdown" class="seconds-counter">5</span> ثوانٍ...</p>
      <div class="progress-bar-bg">
        <div id="progress" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- الأزرار -->
    <div class="actions">
      <a id="redirect-btn" href="#" class="btn btn-primary">الانتقال فوراً الآن 🚀</a>
      <!-- حط رقم الواتساب بتاعك مكان الـ 201000000000 -->
      <a href="https://wa.me/201000000000?text=أهلاً%20محمد،%20حابب%20أستفسر%20عن%20ستاندات%20NFC" target="_blank" class="btn btn-secondary">لمعلومات أكثر أو لطلب ستاند خاص بك 📲</a>
    </div>
  </div>

  <script>
    // جلب الرابط المراد التوجيه له من رابط الصفحة نفسه (URL Parameter)
    // مثال: https://username.github.io/?to=https://facebook.com&title=فيسبوك
    const urlParams = new URLSearchParams(window.location.search);
    
    // الرابط الافتراضي لو مفيش رابط محدد في الـ URL
    const defaultUrl = "https://facebook.com"; 
    const targetUrl = urlParams.get('to') || defaultUrl;
    
    // عنوان الصفحة أو اسمها (اختياري)
    const customTitle = urlParams.get('title');
    if (customTitle) {
      document.getElementById('dest-name').textContent = customTitle + " 🔗";
    }

    // ربط زر الانتقال الفوري بالرابط
    const redirectBtn = document.getElementById('redirect-btn');
    redirectBtn.href = targetUrl;

    // تشغيل العداد التنازلي (5 ثواني)
    let timeLeft = 5;
    const countdownEl = document.getElementById('countdown');
    const progressEl = document.getElementById('progress');

    const timer = setInterval(() => {
      timeLeft--;
      countdownEl.textContent = timeLeft;
      
      const percentage = (timeLeft / 5) * 100;
      progressEl.style.width = percentage + '%';

      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = targetUrl; // التوجيه التلقائي
      }
    }, 1000);
  </script>

</body>
</html>
